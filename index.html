<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10M</title>
  <style>
    body {
      background-color: #33A1FD;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 0 30px #31393C;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #31393C;
    }

    input[type="text"],
    input[type="password"] {
      width: 82%;
      padding: 5%;
      margin: 8px 0;
      border: 2px solid #2176FF;
      border-radius: 10px;
    }

    button {
      width: 94%;
      padding: 10px;
      background-color: #F79824;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #FDCA40;
    }

    a {
      display: block;
      margin-top: 10px;
      text-align: center;
      color: #2176FF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>LOGIN</h2>
    <form onsubmit="return checkLogin()">
      <input type="text" id="username" placeholder="NAME" required>
      <input type="password" id="password" placeholder="ID" required>
      <button type="submit">LOGIN</button>
      <a href="https://t.me/+kQdrQCZ8W_0wMDU0">Forget password?</a>
    </form>
  </div>

  <script>
    function checkLogin() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "10" && password === "m") {
        window.location.href = "home.html"; 
        return false;
      } else {
        alert("Incorrect username or password!");
        return false;
      }
    }
  </script>
</body>
</html>
